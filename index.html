<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Vault</title>
</head>


<body>
    <h1>Semantic Vault</h1>
        <input type="file" id = "fileUpload">
        <button id = "uploadBtn">Upload</button>

        <br><br>

        <input type="text" id = "query" placeholder = "Ask a question? "> 
        <button id = "queryBtn">Query</button>

        <br><br>

        <p id = "anwser"> </p>
        
<script>

document.getElementById("uploadBtn").addEventListener("click", function (){

    let uploadedFile = document.getElementById("fileUpload").files[0];

    let formData = new FormData();
    formData.append("file", uploadedFile);

fetch("https://uvicorn-mainapi-production.up.railway.app/rag/upload", {

    method: "POST",
    body: formData
})

    
});

</script>
        
</body>
</html>
